<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Copilot — Empathetic Reply Assistant</title>
<style>
  :root{
    --ink:#1b2430;
    --ink-soft:#54627a;
    --line:#d7dee6;
    --paper:#f6f8fa;
    --panel:#ffffff;
    --moss:#2f6f5e;      /* calm, positive accent */
    --moss-deep:#1f4f42;
    --moss-wash:#e7f2ee;
    --amber:#c98a2c;     /* status / attention, used sparingly */
    --danger:#b3453b;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }

  header{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:18px 24px 14px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  header h1{
    font-size:1.35rem;
    margin:0;
    font-weight:600;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.92rem;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }

  .setup{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:12px 24px;
    display:flex;
    flex-wrap:wrap;
    gap:10px 18px;
    align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.88rem;
  }
  .setup label{ color:var(--ink-soft); }
  .setup input[type=password],
  .setup input[type=text]{
    font-family:inherit;
    font-size:0.88rem;
    padding:6px 9px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
    min-width:230px;
  }
  .setup .field{ display:flex; align-items:center; gap:6px; }
  .keynote{ color:var(--ink-soft); font-style:italic; }

  main{
    flex:1;
    display:flex;
    gap:18px;
    padding:18px 24px 24px;
    min-height:0;
  }

  .col{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
    flex:1;
  }

  .col-head{
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .col-head h2{
    margin:0;
    font-size:1rem;
    font-weight:600;
  }
  .col-body{
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:12px;
    min-height:0;
    flex:1;
    overflow:auto;
  }

  .actions{ display:flex; gap:8px; flex-wrap:wrap; }

  button{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.86rem;
    border:1px solid var(--moss);
    background:var(--moss);
    color:#fff;
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s ease, transform .05s ease;
  }
  button:hover{ background:var(--moss-deep); border-color:var(--moss-deep); }
  button:active{ transform:translateY(1px); }
  button:disabled{
    background:#cbd3dc; border-color:#cbd3dc; color:#7a8494; cursor:not-allowed;
  }
  button.secondary{
    background:transparent; color:var(--moss-deep); border-color:var(--line);
  }
  button.secondary:hover{ background:var(--moss-wash); border-color:var(--moss); }

  .field-label{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.8rem;
    color:var(--ink-soft);
  }

  textarea{
    width:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.95rem;
    line-height:1.55;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:8px;
    resize:vertical;
    color:var(--ink);
  }
  #customerMessage{
    flex:1;
    min-height:220px;
  }
  #responseText{
    flex:1;
    min-height:220px;
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    font-size:1.02rem;
    background:var(--moss-wash);
    border-color:#cfe3db;
  }

  .note-row{
    display:flex; gap:8px; align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.85rem;
  }
  .note-row input[type=text]{
    flex:1; padding:7px 10px; border:1px solid var(--line); border-radius:7px; font-family:inherit; font-size:0.85rem;
  }

  .status-bar{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:0.82rem;
    color:var(--ink-soft);
    padding:10px 24px;
    border-top:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#b7c0cc;
    flex-shrink:0;
  }
  .dot.busy{ background:var(--amber); animation:pulse 1s infinite ease-in-out; }
  .dot.ok{ background:var(--moss); }
  .dot.err{ background:var(--danger); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  ::placeholder{ color:#9aa5b3; }

  @media (max-width: 760px){
    main{ flex-direction:column; }
  }
</style>
</head>
<body>

<header>
  <h1>Agent Copilot</h1>
  <p>Paste the customer's message, get an empathetic reply</p>
</header>

<div class="setup">
  <div class="field">
    <label for="apiKey">OpenRouter API key</label>
    <input type="password" id="apiKey" placeholder="sk-or-v1-...">
  </div>
  <div class="field">
    <label for="modelName">Model</label>
    <input type="text" id="modelName" value="openai/gpt-4o-mini" style="min-width:170px;">
  </div>
  <button class="secondary" id="saveKeyBtn" type="button">Save in this browser</button>
  <span class="keynote">Stored only in this browser's local storage — never written into this file.</span>
</div>

<main>
  <section class="col">
    <div class="col-head">
      <h2>Customer's message</h2>
    </div>
    <div class="col-body">
      <textarea id="customerMessage" placeholder="Paste or type what the customer just said..."></textarea>
      <div class="note-row">
        <label for="extraNote" class="field-label" style="white-space:nowrap;">Note for AI</label>
        <input type="text" id="extraNote" placeholder="e.g. keep it brief, they're asking for a refund...">
      </div>
      <div class="actions">
        <button id="generateBtn" type="button">Generate empathetic reply</button>
      </div>
    </div>
  </section>

  <section class="col">
    <div class="col-head">
      <h2>Suggested reply</h2>
    </div>
    <div class="col-body">
      <textarea id="responseText" placeholder="Your empathetic, positive-toned reply will appear here."></textarea>
      <div class="actions">
        <button id="copyBtn" type="button" class="secondary">Copy to clipboard</button>
      </div>
    </div>
  </section>
</main>

<div class="status-bar">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">Ready. Paste a customer message and generate a reply.</span>
</div>

<script>
(function(){
  const apiKeyInput = document.getElementById('apiKey');
  const modelInput = document.getElementById('modelName');
  const saveKeyBtn = document.getElementById('saveKeyBtn');
  const customerMessage = document.getElementById('customerMessage');
  const extraNoteInput = document.getElementById('extraNote');
  const responseText = document.getElementById('responseText');
  const generateBtn = document.getElementById('generateBtn');
  const copyBtn = document.getElementById('copyBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  // ---- persisted settings (this browser only) ----
  const savedKey = localStorage.getItem('agentCopilot_apiKey');
  const savedModel = localStorage.getItem('agentCopilot_model');
  if (savedKey) apiKeyInput.value = savedKey;
  if (savedModel) modelInput.value = savedModel;

  saveKeyBtn.addEventListener('click', () => {
    localStorage.setItem('agentCopilot_apiKey', apiKeyInput.value.trim());
    localStorage.setItem('agentCopilot_model', modelInput.value.trim());
    setStatus('ok', 'Settings saved in this browser.');
  });

  function setStatus(kind, msg){
    statusDot.className = 'dot' + (kind ? ' ' + kind : '');
    statusText.textContent = msg;
  }

  const SYSTEM_PROMPT = `You are an assistant helping a live customer service agent. You will be given a
message just sent by a customer. Draft ONE suggested reply the agent could send back.

Requirements:
- Lead with genuine, specific empathy for the customer's situation (not generic phrases like
  "I understand your frustration" repeated every time — respond to what THIS customer actually said).
- Use warm, positive, solution-focused language throughout.
- Be concise: 2-4 sentences.
- Be professional and calm, never dismissive.
- Do NOT invent facts about the customer's account, order, or company policies that weren't given to you.
- If the message is unclear or missing details needed to help, write a reply that asks a clarifying
  question empathetically rather than guessing.
- Return ONLY the suggested reply text. No preamble, no labels, no quotes.`;

  generateBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    const model = modelInput.value.trim() || 'openai/gpt-4o-mini';
    const message = customerMessage.value.trim();
    const note = extraNoteInput.value.trim();

    if (!apiKey){
      setStatus('err', 'Add your OpenRouter API key above first.');
      return;
    }
    if (!message){
      setStatus('err', 'Paste the customer\'s message first.');
      return;
    }

    let userContent = `Customer's message:\n---\n${message}\n---`;
    if (note) userContent += `\n\nAdditional instruction from the agent: ${note}`;

    generateBtn.disabled = true;
    setStatus('busy', 'Asking the AI for a suggested reply...');

    try{
      const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: model,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: userContent }
          ],
          temperature: 0.6,
          max_tokens: 300
        })
      });

      if (!resp.ok){
        const errText = await resp.text();
        throw new Error(`API error ${resp.status}: ${errText.slice(0,200)}`);
      }

      const data = await resp.json();
      const reply = data.choices?.[0]?.message?.content?.trim() || '(No reply returned.)';
      responseText.value = reply;
      setStatus('ok', 'Reply drafted. Review it before sending to the customer.');
    }catch(err){
      setStatus('err', 'Could not generate a reply: ' + err.message);
    }finally{
      generateBtn.disabled = false;
    }
  });

  // ---- copy ----
  copyBtn.addEventListener('click', async () => {
    if (!responseText.value.trim()) return;
    try{
      await navigator.clipboard.writeText(responseText.value.trim());
      setStatus('ok', 'Reply copied to clipboard.');
    }catch(err){
      responseText.select();
      document.execCommand('copy');
      setStatus('ok', 'Reply copied to clipboard.');
    }
  });

  // Allow Ctrl/Cmd+Enter in the message box to trigger generation
  customerMessage.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
      generateBtn.click();
    }
  });
})();
</script>

</body>
</html>
